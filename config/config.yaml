# Dallo DevSecOps 설정 (config/config.yaml)

# 파이프라인 설정
pipeline:
  # 분석 순서: 정적 분석 → 중복 제거 → 위험도 산정 → 정책 필터 → LLM → 검증
  deduplication:
    enabled: true
    similarity_threshold: 0.85  # 코드 유사도 임계값 (0~1)

  risk_scoring:
    enabled: true

  policy_filter:
    enabled: false  # 기업 보안 정책 필터 (현재 비활성)
    # 아래 조건에 해당하는 취약점은 LLM 전달에서 제외
    exclude_rules: []           # 제외할 rule_id 목록 (예: ["B101", "B105"])
    min_severity: "LOW"         # 이 심각도 미만은 제외 (LOW/MEDIUM/HIGH/CRITICAL)
    exclude_cwe: []             # 제외할 CWE ID 목록

# LLM 설정
llm:
  primary_provider: "gemini"
  batch_size: 5                 # 배치 처리 시 최대 취약점 수
  cache_ttl_days: 7             # 캐시 TTL (일)
  optimization:
    enabled: true               # LLM 호출 전 선택적 대상 축소
    max_targets: 10             # 한 번의 분석에서 LLM에 넘길 최대 취약점 수
    max_context_chars: 2400     # 취약점별 프롬프트 코드 문맥 최대 길이
    batch_enabled: true         # 같은 파일 취약점은 단일 배치 프롬프트로 처리
    # 소스코드 분석은 CVE보다 CWE/rule ID가 안정적으로 붙으므로
    # 기본 LLM 수정 대상은 악용 가능성이 큰 CWE 유형으로 제한합니다.
    # 빈 배열로 바꾸면 탐지된 모든 취약점을 LLM 대상으로 허용합니다.
    cve_scope: []               # 예: ["CVE-2024-1234"] (의존성/메타데이터 기반)
    cwe_scope: ["CWE-89", "CWE-78", "CWE-79", "CWE-288", "CWE-502", "CWE-22", "CWE-798"]
    rule_scope: []              # 예: ["B608", "python.lang.security.audit"]

# Semgrep 룰셋 설정
semgrep:
  # registry ruleset은 넓은 기본 탐지용, local custom은 WebGoat/캡스톤 시나리오 보완용
  configs:
    - auto
    - p/security-audit
    - p/owasp-top-ten
    - p/java
    - p/findsecbugs
    - config/semgrep/custom-java-security.yml
  timeout_seconds: 120

# CI/CD Gate 설정
ci_gate:
  critical_threshold: 1         # critical N개 이상이면 빌드 실패
  high_threshold: 5             # high N개 이상이면 빌드 실패
